name: Déploiement GitHub Pages

on:
  push:
    branches: ["claude/mortgage-simulator-platform-rjcwyk"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; ne pas annuler un déploiement en cours.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Pages (activation automatique)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Envoi du site (racine du dépôt)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Déploiement vers GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
